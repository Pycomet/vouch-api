name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vouch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vouch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VOUCH_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vouch_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

      - name: Migrate the database to head
        env:
          VOUCH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vouch_test
        run: alembic upgrade head

      - name: Check the models match the migrations
        env:
          VOUCH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vouch_test
        run: alembic check

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the container image (no push)
        run: docker build --tag vouch-api:ci .

      - name: Check the image imports the app and its commands
        run: >-
          docker run --rm vouch-api:ci
          python -c "import app.main, app.cli, app.jobs.timers"

      - name: Validate compose.yml
        run: cp .env.example .env && docker compose config --quiet
