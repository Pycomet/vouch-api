# Local and single-host deployment (M3a §2.2). See docs/DEPLOY.md.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD (and the secrets)
#   docker compose up -d --build
#
# Order: postgres (healthy) -> migrate (one-shot, must succeed) -> api, timers.
# The services read every VOUCH_* setting from .env; VOUCH_DATABASE_URL is set
# here so the containers reach the postgres service, not localhost.
# Postgres publishes no host port; use `docker compose exec postgres psql` to reach it.

name: vouch

x-app: &app
  build: .
  image: vouch-api:local
  env_file: .env
  environment:
    VOUCH_DATABASE_URL: postgresql+asyncpg://vouch:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vouch
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vouch
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    # The image's default command: uvicorn on port 8000, with the image HEALTHCHECK
    # on GET /api/v1/health/ready. Published on the host's loopback only: put a
    # reverse proxy on the same host in front of it (docs/DEPLOY.md §2).
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  timers:
    <<: *app
    command: ["python", "-m", "app.jobs.timers"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The outbox dispatcher arrives in M3a step 5 (`python -m app.jobs.outbox`).
  # Until that module exists this service stays commented out.
  # outbox:
  #   <<: *app
  #   command: ["python", "-m", "app.jobs.outbox"]
  #   healthcheck:
  #     disable: true
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully

volumes:
  pgdata:
